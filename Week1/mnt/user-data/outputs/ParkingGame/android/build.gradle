// android/build.gradle
// Path: android/build.gradle
//
// The 'android' module is the thin Android wrapper.
// It depends on :core and adds the LibGDX Android backend.

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.parkinggame'
    compileSdk 34

    defaultConfig {
        applicationId "com.parkinggame"
        minSdk 26               // Android 8.0 — good modern baseline
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Signing config for release APK
    signingConfigs {
        release {
            // TODO: Replace with your keystore details before publishing
            // storeFile file("my-key.jks")
            // storePassword "your_store_password"
            // keyAlias "your_key_alias"
            // keyPassword "your_key_password"
        }
    }

    buildTypes {
        debug {
            // Debug builds are unsigned — fine for emulator testing
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release  // Uncomment when keystore is configured
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    // Source set — tells Gradle where your Kotlin/Java files are
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            kotlin.srcDirs = ['src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['../assets']  // Shared assets folder
        }
    }
}

dependencies {
    implementation project(':core')                                              // Your game logic
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"     // LibGDX Android backend
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"       // For emulator
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"    // For emulator
}

// This task copies LibGDX native .so files into the jniLibs folder
// LibGDX needs this to run on device/emulator
task copyAndroidNatives() {
    file("libs/armeabi-v7a/").mkdirs()
    file("libs/arm64-v8a/").mkdirs()
    file("libs/x86/").mkdirs()
    file("libs/x86_64/").mkdirs()

    configurations.natives.copy().each { jar ->
        def outputDir = null
        if      (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
        else if (jar.name.endsWith("natives-arm64-v8a.jar"))   outputDir = file("libs/arm64-v8a")
        else if (jar.name.endsWith("natives-x86.jar"))         outputDir = file("libs/x86")
        else if (jar.name.endsWith("natives-x86_64.jar"))      outputDir = file("libs/x86_64")
        if (outputDir != null) {
            copy {
                from zipTree(jar)
                into outputDir
                include "*.so"
            }
        }
    }
}
