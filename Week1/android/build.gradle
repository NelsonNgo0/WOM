// android/build.gradle

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

configurations {
    natives
}

android {
    namespace 'com.parkinggame'
    compileSdk 34

    defaultConfig {
        applicationId "com.parkinggame"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // storeFile file("my-key.jks")
            // storePassword "your_store_password"
            // keyAlias "your_key_alias"
            // keyPassword "your_key_password"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            kotlin.srcDirs = ['src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

task copyAndroidNatives() {
    doFirst {
        def jniDir = file("src/main/jniLibs")
        ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"].each { abi ->
            file("${jniDir}/${abi}").mkdirs()
        }
        configurations.natives.copy().each { jar ->
            def abi = null
            if      (jar.name.endsWith("natives-armeabi-v7a.jar")) abi = "armeabi-v7a"
            else if (jar.name.endsWith("natives-arm64-v8a.jar"))   abi = "arm64-v8a"
            else if (jar.name.endsWith("natives-x86.jar"))         abi = "x86"
            else if (jar.name.endsWith("natives-x86_64.jar"))      abi = "x86_64"
            if (abi) {
                copy {
                    from zipTree(jar)
                    into file("${jniDir}/${abi}")
                    include "*.so"
                }
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.contains("compile") || task.name.contains("merge")) {
        task.dependsOn copyAndroidNatives
    }
}